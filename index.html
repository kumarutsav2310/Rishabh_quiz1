  --bg: #F3F6F2; --card: #FFFFFF; --ink: #0B2239; --muted: #5B6B7B; --line: #DCE4DC; --line-2: #E8EEE8;
  --code-bg: #F7FAF5; --out-bg: #F3F5F7; --str: #0E7C86; --com: #8795A1; --esc: #D5EEEC;
  --bad: #B03A2E; --bad-bg: #FDF1F0; --amber: #C77A00;
  --f-display: 'Outfit', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, 'Courier New', monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* top bar */
.top { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 20; }
.top-in { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
.top img { height: 40px; width: auto; display: block; }
.top-title { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--green-l); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer { font-family: var(--f-mono); font-weight: 700; font-size: 16px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.timer.low { background: var(--amber); border-color: var(--amber); color: #fff; }
.progress { height: 5px; background: rgba(255,255,255,.12); }
.progress > div { height: 100%; width: 0; background: var(--green-l); transition: width .25s ease; }

main { flex: 1; width: 100%; max-width: 820px; margin: 0 auto; padding: 20px 16px 28px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 20px; }
@media (max-width: 560px) { .card { padding: 18px 16px; border-radius: 14px; } main { padding-top: 14px; } }

/* start screen */
.kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--green-d); font-weight: 700; margin: 0 0 6px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 6vw, 42px); line-height: 1.05; margin: 0 0 6px; letter-spacing: -.01em; }
h1 span { color: var(--green); }
.sub { color: var(--muted); margin: 0 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 5px 10px; border-radius: 999px; background: var(--green-bg); color: var(--green-d); }
.chip.navy { background: var(--navy); color: #fff; }
.chip.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
@media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }
.box { border: 1px solid var(--line-2); background: #FAFCF9; border-radius: 12px; padding: 14px 16px; min-width: 0; }
.box h3 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--green-d); margin: 0 0 8px; }
.box ol, .box ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15px; }
.secs { list-style: none; padding: 0 !important; }
.secs li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line-2); padding-bottom: 4px; }
.secs li:last-child { border-bottom: none; }
.secs .cl { color: var(--muted); font-size: 13px; white-space: nowrap; }
.field { display: grid; gap: 6px; margin-bottom: 16px; max-width: 360px; }
.field label { font-weight: 700; font-size: 14px; }
.field input { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; }
.field input:focus { outline: 3px solid rgba(64,168,0,.25); border-color: var(--green); }

/* buttons */
.btn { border: none; border-radius: 10px; padding: 11px 18px; font-weight: 700; cursor: pointer; background: var(--navy); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
.btn.green { background: var(--green); color: #fff; }
.btn.green:hover { background: var(--green-d); }
.btn.light { background: #fff; color: var(--navy); border: 1.5px solid var(--line); }
.btn.big { font-size: 17px; padding: 13px 22px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .opt:focus-within, .pal button:focus-visible, .ord button:focus-visible { outline: 3px solid var(--green-l); outline-offset: 2px; }

/* question */
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.qnum { margin-left: auto; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.prompt { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.3; margin: 0 0 14px; }
code.ic { font-family: var(--f-mono); font-size: .86em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; white-space: pre-wrap; word-break: break-word; }
pre { margin: 0; font-family: var(--f-mono); }
.code { background: var(--code-bg); border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px; font-size: 14.5px; line-height: 1.6; }
.code .ln { display: block; white-space: pre; counter-increment: ln; }
.code .ln::before { content: counter(ln); display: inline-block; width: 1.6em; margin-right: 12px; text-align: right; color: var(--com); user-select: none; -webkit-user-select: none; }
.code code { counter-reset: ln; display: block; }
.s { color: var(--str); } .c { color: var(--com); } .k, .b { font-weight: 700; } .n { color: var(--green-d); } .e { font-weight: 700; background: var(--esc); border-radius: 3px; }
.types { margin: 0 0 12px; font-size: 15px; }
kbd { font-family: var(--f-mono); font-weight: 700; font-size: 14px; color: var(--green-d); background: #fff; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; }
.panel { border-radius: 10px; padding: 10px 14px; margin: 0 0 12px; border: 1px solid; }
.panel .lbl { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 4px; }
.panel pre { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
.panel.err { background: var(--bad-bg); border-color: #EDD3D3; }
.panel.err .lbl { color: var(--bad); }
.panel.err pre { color: var(--ink); font-weight: 700; }
.panel.out { background: var(--out-bg); border-color: #DCE3EA; }
.panel.out .lbl { color: var(--muted); }

.opts { display: grid; gap: 10px; margin-top: 4px; }
.opt { display: flex; align-items: flex-start; gap: 12px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: #fff; transition: border-color .12s ease, background .12s ease; min-width: 0; }
.opt:hover { border-color: #B9D3A8; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt .let { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 14px; background: var(--bg); color: var(--muted); }
.opt.on { border-color: var(--green); background: var(--green-bg); }
.opt.on .let { background: var(--green); color: #fff; }
.otext { min-width: 0; padding-top: 2px; overflow-wrap: anywhere; }
.otext.f-code, .otext.f-out { font-family: var(--f-mono); font-size: 14.5px; white-space: pre-wrap; line-height: 1.55; padding-top: 3px; }
.otext.f-out { background: var(--out-bg); border-radius: 6px; padding: 3px 8px; display: inline-block; }
.typed { width: 100%; font-family: var(--f-mono); font-size: 17px; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fff; }
.typed:focus { outline: 3px solid rgba(64,168,0,.25); border-color: var(--green); }
.hint { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.ord { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ord li { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #fff; }
.ord li .num { font-family: var(--f-mono); font-weight: 700; color: var(--muted); width: 18px; text-align: center; flex: none; }
.ord li .ltxt { flex: 1; min-width: 0; font-family: var(--f-mono); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ord li .mv { display: flex; gap: 4px; flex: none; }
.ord button { width: 36px; height: 36px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; font-size: 16px; }
.ord button:disabled { opacity: .3; cursor: default; }

.nav { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.nav .grow { flex: 1; }
.nav .btn { white-space: nowrap; }
.nav .mid { font-family: var(--f-mono); font-size: 13px; }
@media (max-width: 560px) {
  .nav { gap: 8px; }
  .nav .btn { padding: 10px 13px; }
  .nav .mid { padding: 10px 10px; }
  .nav .mid .lw { display: none; }
  .code { font-size: 13.5px; }
  .code .ln { white-space: pre-wrap; overflow-wrap: anywhere; padding-left: calc(1.6em + 10px); text-indent: calc(-1.6em - 10px); }
  .code .ln::before { margin-right: 10px; text-indent: 0; }
}

/* modal */
.modal { position: fixed; inset: 0; background: rgba(11,34,57,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal .card { width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto; }
.modal h2 { font-family: var(--f-display); font-weight: 800; font-size: 24px; margin: 0 0 8px; }
.pal h3 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
.pal .row { display: flex; flex-wrap: wrap; gap: 6px; }
.pal button { width: 42px; height: 38px; border-radius: 9px; border: 1.5px solid var(--line); background: #fff; font-family: var(--f-mono); font-weight: 700; cursor: pointer; }
.pal button.done { background: var(--green); border-color: var(--green); color: #fff; }
.pal button.cur { box-shadow: 0 0 0 2px var(--navy); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1.5px solid var(--line); }
.legend i.d { background: var(--green); border-color: var(--green); }
.mbtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 18px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 60; box-shadow: 0 6px 24px rgba(11,34,57,.25); max-width: calc(100vw - 32px); text-align: center; }
.toast.warn { background: var(--amber); }

/* results */
.hero { background: var(--navy); color: #fff; border-radius: 16px; padding: 24px 22px; display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; text-align: left; } }
.ring { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.ring .in { width: 104px; height: 104px; border-radius: 50%; background: var(--navy); display: grid; place-items: center; text-align: center; }
.ring .sc { font-family: var(--f-display); font-weight: 800; font-size: 32px; line-height: 1; }
.ring .of { font-family: var(--f-mono); font-size: 12px; color: #B8C7D6; margin-top: 3px; }
.hero .badge { font-family: var(--f-mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--green-l); font-weight: 700; }
.hero h2 { font-family: var(--f-display); font-weight: 800; font-size: 30px; margin: 4px 0 6px; line-height: 1.1; }
.hero p { margin: 0; color: #CFDAE5; }
.banner { background: #FFF6E5; border: 1px solid #F0D9A8; color: #6B4700; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-weight: 700; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 4px 12px; align-items: center; }
.bar-row .nm { font-size: 15px; }
.bar-row .nm small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.bar-row .v { font-family: var(--f-mono); font-weight: 700; text-align: right; }
.bar-row .track { grid-column: 1 / -1; height: 8px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--green); border-radius: 99px; }
.copybox { border: 2px solid var(--green); background: var(--green-bg); }
.copybox p { margin: 0 0 12px; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.copytxt { width: 100%; min-height: 160px; font-family: var(--f-mono); font-size: 12.5px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 8px; background: #fff; resize: vertical; }
.rev-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 22px 0 10px; }
.rev-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 24px; margin: 0; flex: 1; }
.toggle { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.toggle button { border: none; background: #fff; padding: 7px 12px; cursor: pointer; font-weight: 700; font-size: 14px; }
.toggle button.on { background: var(--navy); color: #fff; }
.rev { margin-bottom: 12px; border-left: 5px solid var(--green); }
.rev.wrong { border-left-color: var(--bad); }
.rev .rtop { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.rev .mark { font-family: var(--f-mono); font-weight: 700; font-size: 12px; letter-spacing: .1em; padding: 3px 8px; border-radius: 6px; background: var(--green-bg); color: var(--green-d); }
.rev.wrong .mark { background: var(--bad-bg); color: var(--bad); }
.rev .rq { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.rev .prompt { font-size: 18px; margin-bottom: 10px; }
.ans { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 15px; margin: 8px 0; }
@media (max-width: 560px) { .ans { grid-template-columns: 1fr; } .ans dt { margin-top: 4px; } }
.ans dt { color: var(--muted); font-size: 13px; font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding-top: 3px; }
.ans dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ans .mono { font-family: var(--f-mono); font-size: 14px; white-space: pre-wrap; }
.ans .yours.bad { color: var(--bad); }
.ans .yours.good, .ans .right { color: var(--green-d); font-weight: 700; }
.why { background: #FAFCF9; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-top: 8px; }
.why b { color: var(--green-d); }
.note { font-size: 14px; color: var(--muted); margin-top: 6px; }

footer.foot { border-top: 1px solid var(--line); background: #fff; }
footer .in { max-width: 820px; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13px; color: var(--muted); }
footer b { color: var(--navy); }
footer a { color: var(--green-d); text-decoration: none; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
(function () {
  'use strict';
  var KEY = 'rm-rishabh-checkpoint-1';
  var TOTAL_MS = 50 * 60 * 1000;
  var XK = 'RhobustMinds';

  function decode(b64) {
    var bin = atob(b64.replace(/\s+/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ XK.charCodeAt(i % XK.length);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }
  var D = decode(document.getElementById('qdata').textContent);
  var Qs = D.questions, N = Qs.length, SECS = D.sections;
  var LET = 'ABCDEF';

  function fresh() { return { name: D.student, started: null, answers: {}, cur: 0, submitted: null, auto: false, w10: false, w2: false, attempt: 0 }; }
  function load() { try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage off: the quiz still works, it just won't survive a reload */ } }
  function attempts(bump) {
    var n = 0;
    try { n = parseInt(localStorage.getItem(KEY + '-attempts') || '0', 10) || 0; if (bump) { n += 1; localStorage.setItem(KEY + '-attempts', String(n)); } } catch (e) { n = bump ? 1 : n; }
    return n;
  }
  var S;
  if (/[?&]reset\b/.test(location.search)) {
    try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '-attempts'); } catch (e) {}
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    S = fresh();
  } else {
    S = load() || fresh();
  }

  var app = document.getElementById('app');
  var timerEl = document.getElementById('timer');
  var progEl = document.getElementById('progress');
  var barEl = document.getElementById('bar');
  var modal = document.getElementById('modal');
  var toastEl = document.getElementById('toast');
  var tick = null, toastT = null;

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function secOf(q) { for (var i = 0; i < SECS.length; i++) if (SECS[i].id === q.sec) return SECS[i]; return SECS[0]; }
  function isAnswered(i) { var a = S.answers[i]; return a !== undefined && a !== null && a !== ''; }
  function answeredCount() { var c = 0; for (var i = 0; i < N; i++) if (isAnswered(i)) c++; return c; }
  function norm(s) { return String(s).replace(/\r/g, '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/ /g, ' ').trim(); }
  function correct(i) {
    var q = Qs[i], a = S.answers[i];
    if (q.kind === 'mcq') return a === q.answer;
    if (q.kind === 'type') return a !== undefined && norm(a) === q.expected;
    if (q.kind === 'order') {
      var ord = Array.isArray(a) ? a : q.start;
      return q.accepted.some(function (acc) { return acc.join(',') === ord.join(','); });
    }
    return false;
  }

  function toast(msg, warn) {
    toastEl.textContent = msg;
    toastEl.className = 'toast' + (warn ? ' warn' : '');
    toastEl.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.hidden = true; }, 3500);
  }
  function chrome(on) {
    timerEl.hidden = !on; progEl.hidden = !on;
    if (on) barEl.style.width = (100 * answeredCount() / N) + '%';
  }

  // ------------------------------------------------------------ timer
  function startTimer() { clearInterval(tick); updateTimer(); tick = setInterval(updateTimer, 1000); }
  function updateTimer() {
    if (!S.started || S.submitted) return;
    var left = S.started + TOTAL_MS - Date.now();
    if (left <= 0) { submit(true); return; }
    var m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    timerEl.textContent = pad(m) + ':' + pad(s);
    timerEl.classList.toggle('low', left <= 5 * 60 * 1000);
    if (!S.w2 && left <= 2 * 60 * 1000) { S.w2 = true; S.w10 = true; save(); toast('Less than 2 minutes left. Finish up!', true); }
    else if (!S.w10 && left <= 10 * 60 * 1000) { S.w10 = true; save(); toast(Math.ceil(left / 60000) + ' minutes left', true); }
  }
  document.addEventListener('visibilitychange', updateTimer);

  // ------------------------------------------------------------ screens
  function render() {
    closeModal();
    if (S.submitted) return renderResults();
    if (!S.started) return renderStart();
    renderQuestion();
  }

  function renderStart() {
    chrome(false);
    var secs = SECS.map(function (s) {
      var n = Qs.filter(function (q) { return q.sec === s.id; }).length;
      return '<li><span>' + esc(s.name) + ' <span class="cl">· ' + n + '</span></span><span class="cl">' + esc(s.classes) + '</span></li>';
    }).join('');
    app.innerHTML =
      '<section class="card">' +
      '<p class="kicker">World 1 · Code Quest · Checkpoint 1</p>' +
      '<h1>Python <span>Checkpoint</span></h1>' +
      '<p class="sub">' + esc(D.subtitle) + '</p>' +
      '<div class="chips"><span class="chip navy">' + N + ' questions</span><span class="chip">About 45 minutes</span><span class="chip">50-minute timer</span></div>' +
      '<div class="grid2">' +
      '<div class="box"><h3>What’s inside</h3><ul class="secs">' + secs + '</ul></div>' +
      '<div class="box"><h3>Rules</h3><ol>' +
      '<li>Think like Python: read the code and predict. Keep Colab closed.</li>' +
      '<li>Spaces matter, especially in the answers you type.</li>' +
      '<li>You can go back and change answers until you submit.</li>' +
      '<li>The timer starts when you press Start. At 0:00 your answers are sent in.</li>' +
      '<li>At the end, copy your results and paste them in Google Classroom.</li>' +
      '</ol></div></div>' +
      '<div class="field"><label for="nm">Your name</label><input id="nm" autocomplete="off" maxlength="40" value="' + esc(S.name || D.student) + '"></div>' +
      '<button class="btn green big" id="go" type="button">Start the quiz</button>' +
      '</section>';
    document.getElementById('go').onclick = function () {
      var nm = document.getElementById('nm').value.trim();
      S.name = nm || D.student;
      S.started = Date.now(); S.cur = 0; S.answers = {}; S.w10 = false; S.w2 = false;
      S.attempt = attempts(true);
      save(); startTimer(); render(); window.scrollTo(0, 0);
    };
  }

  function codeBlock(html) { return '<pre class="code"><code>' + html + '</code></pre>'; }
  function extras(q) {
    var h = '';
    if (q.code) h += codeBlock(q.code);
    if (q.inputs && q.inputs.length) h += '<p class="types">You type: ' + q.inputs.map(function (a) { return '<kbd>' + esc(a) + '</kbd>'; }).join(' then ') + '</p>';
    if (q.shows) h += '<div class="panel out"><span class="lbl">It prints</span><pre>' + esc(q.shows) + '</pre></div>';
    if (q.err) h += '<div class="panel err"><span class="lbl">Colab says</span><pre>' + esc(q.err) + '</pre></div>';
    return h;
  }

  function renderQuestion() {
    chrome(true);
    var i = S.cur, q = Qs[i], sec = secOf(q), a = S.answers[i];
    var h = '<div class="qmeta"><span class="chip">' + esc(sec.name) + '</span><span class="chip ghost">' + esc(sec.classes) + '</span><span class="qnum">Question ' + (i + 1) + ' of ' + N + '</span></div>';
    h += '<section class="card"><h2 class="prompt">' + q.prompt + '</h2>' + extras(q);
    if (q.kind === 'mcq') {
      h += '<div class="opts" role="radiogroup" aria-label="Answers">' + q.options.map(function (o, k) {
        return '<label class="opt' + (a === k ? ' on' : '') + '"><input type="radio" name="opt" value="' + k + '"' + (a === k ? ' checked' : '') + '>' +
          '<span class="let">' + LET[k] + '</span><span class="otext f-' + o.f + '">' + o.html + '</span></label>';
      }).join('') + '</div>';
    } else if (q.kind === 'type') {
      h += '<input class="typed" id="typed" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the output here" aria-label="Your answer" value="' + esc(a || '') + '">' +
        '<p class="hint">Type exactly what appears under the cell: same spaces, no quotes.</p>';
    } else if (q.kind === 'order') {
      var ord = Array.isArray(a) ? a : q.start.slice();
      h += '<ol class="ord" id="ord">' + ord.map(function (li, p) {
        return '<li><span class="num">' + (p + 1) + '</span><span class="ltxt">' + q.lines[li] + '</span><span class="mv">' +
          '<button type="button" data-p="' + p + '" data-d="-1" aria-label="Move line ' + (p + 1) + ' up"' + (p === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button type="button" data-p="' + p + '" data-d="1" aria-label="Move line ' + (p + 1) + ' down"' + (p === ord.length - 1 ? ' disabled' : '') + '>↓</button></span></li>';
      }).join('') + '</ol><p class="hint">Line 1 runs first.</p>';
    }
    h += '</section>';
    var last = i === N - 1;
    h += '<div class="nav"><button class="btn light" id="back" type="button"' + (i === 0 ? ' disabled' : '') + '>← Back</button>' +
      '<span class="grow"></span><button class="btn light mid" id="pal" type="button">' + answeredCount() + '/' + N + '<span class="lw">&nbsp;answered</span></button><span class="grow"></span>' +
      '<button class="btn ' + (last ? 'green' : '') + '" id="next" type="button">' + (last ? 'Finish' : 'Next →') + '</button></div>';
    app.innerHTML = h;

    if (q.kind === 'mcq') {
      app.querySelectorAll('input[name=opt]').forEach(function (inp) {
        inp.addEventListener('change', function () {
          S.answers[i] = parseInt(inp.value, 10); save();
          app.querySelectorAll('.opt').forEach(function (l) { l.classList.remove('on'); });
          inp.closest('.opt').classList.add('on');
          refreshCount();
        });
      });
    } else if (q.kind === 'type') {
      var t = document.getElementById('typed');
      t.addEventListener('input', function () { if (t.value === '') delete S.answers[i]; else S.answers[i] = t.value; save(); refreshCount(); });
      t.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(1); } });
    } else if (q.kind === 'order') {
      document.getElementById('ord').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var p = parseInt(b.dataset.p, 10), d = parseInt(b.dataset.d, 10);
        var ord = Array.isArray(S.answers[i]) ? S.answers[i].slice() : q.start.slice();
        var t2 = ord[p]; ord[p] = ord[p + d]; ord[p + d] = t2;
        S.answers[i] = ord; save(); renderQuestion();
        var again = app.querySelector('button[data-p="' + (p + d) + '"][data-d="' + d + '"]') || app.querySelector('button[data-p="' + (p + d) + '"]');
        if (again && !again.disabled) again.focus();
      });
    }
    document.getElementById('back').onclick = function () { go(-1); };
    document.getElementById('next').onclick = function () { if (last) confirmSubmit(); else go(1); };
    document.getElementById('pal').onclick = openPalette;
  }
  function refreshCount() {
    var b = document.getElementById('pal'); if (b) b.innerHTML = answeredCount() + '/' + N + '<span class="lw">&nbsp;answered</span>';
    barEl.style.width = (100 * answeredCount() / N) + '%';
  }
  function go(d) {
    var n = S.cur + d; if (n < 0 || n >= N) return;
    S.cur = n; save(); renderQuestion(); window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------ modals
  function closeModal() { modal.hidden = true; modal.innerHTML = ''; }
  function openModal(html) { modal.innerHTML = '<div class="card">' + html + '</div>'; modal.hidden = false; var f = modal.querySelector('button'); if (f) f.focus(); }
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) { closeModal(); return; }
    if (!modal.hidden || !S.started || S.submitted) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' && e.target.type === 'text') return;
    var q = Qs[S.cur];
    if (q.kind === 'mcq') {
      var k = '1234'.indexOf(e.key); if (k < 0) k = 'abcd'.indexOf((e.key || '').toLowerCase());
      if (k >= 0 && k < q.options.length) { var r = app.querySelectorAll('input[name=opt]')[k]; if (r) { r.checked = true; r.dispatchEvent(new Event('change')); } }
    }
  });

  function openPalette() {
    var h = '<h2>All questions</h2><div class="pal">';
    SECS.forEach(function (s) {
      var row = '';
      Qs.forEach(function (q, i) { if (q.sec === s.id) row += '<button type="button" data-i="' + i + '" class="' + (isAnswered(i) ? 'done' : '') + (i === S.cur ? ' cur' : '') + '" aria-label="Question ' + (i + 1) + (isAnswered(i) ? ', answered' : ', not answered') + '">' + (i + 1) + '</button>'; });
      h += '<h3>' + esc(s.name) + '</h3><div class="row">' + row + '</div>';
    });
    h += '</div><div class="legend"><span><i class="d"></i>answered</span><span><i></i>not yet</span></div>' +
      '<div class="mbtns"><button class="btn light" type="button" id="mclose">Close</button><button class="btn green" type="button" id="msub">Submit answers</button></div>';
    openModal(h);
    modal.querySelectorAll('.pal button').forEach(function (b) { b.onclick = function () { S.cur = parseInt(b.dataset.i, 10); save(); closeModal(); renderQuestion(); window.scrollTo(0, 0); }; });
    document.getElementById('mclose').onclick = closeModal;
    document.getElementById('msub').onclick = confirmSubmit;
  }

  function confirmSubmit() {
    var left = N - answeredCount();
    openModal('<h2>Submit your answers?</h2><p>' + (left === 0 ? 'You answered all ' + N + ' questions.' : 'You still have <b>' + left + '</b> question' + (left === 1 ? '' : 's') + ' with no answer. Those count as wrong.') +
      ' You can’t change answers after you submit.</p><div class="mbtns"><button class="btn light" type="button" id="mkeep">Keep working</button><button class="btn green" type="button" id="mgo">Submit</button></div>');
    document.getElementById('mkeep').onclick = closeModal;
    document.getElementById('mgo').onclick = function () { submit(false); };
  }

  function submit(auto) {
    var now = Date.now();
    S.submitted = auto ? Math.min(now, S.started + TOTAL_MS) : now;
    S.auto = !!auto;
    save(); clearInterval(tick); closeModal(); render(); window.scrollTo(0, 0);
  }

  // ------------------------------------------------------------ results
  function answerText(i, a) {
    var q = Qs[i];
    if (q.kind === 'mcq') return (a === undefined || a === null) ? null : LET[a] + '. ' + q.options[a].plain;
    if (q.kind === 'type') return (a === undefined || a === '') ? null : a;
    if (q.kind === 'order') { var ord = Array.isArray(a) ? a : q.start; return ord.map(function (k) { return q.linesPlain[k]; }).join('\n'); }
    return null;
  }
  function correctText(i) {
    var q = Qs[i];
    if (q.kind === 'mcq') return LET[q.answer] + '. ' + q.options[q.answer].plain;
    if (q.kind === 'type') return q.expected;
    if (q.kind === 'order') return q.accepted[0].map(function (k) { return q.linesPlain[k]; }).join('\n');
  }
  function badge(p) {
    if (p >= 90) return ['Code Ninja', 'Outstanding. You read code like Python does.'];
    if (p >= 75) return ['Code Knight', 'Strong work. A few spots to sharpen below.'];
    if (p >= 50) return ['Code Explorer', 'Good progress. The review below shows what to practice.'];
    return ['Code Apprentice', 'Every coder starts here. Go through the review with your teacher.'];
  }
  function fmtTime(ms) { var s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ' min ' + pad(s % 60) + ' s'; }
  function fmtDate(t) {
    try { return new Date(t).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return new Date(t).toString(); }
  }

  function resultsText(score, pct, perSec) {
    var L = [];
    L.push('RHOBUST MINDS · PYTHON CHECKPOINT 1 (Classes 1–8)');
    L.push('Name: ' + S.name);
    L.push('Submitted: ' + fmtDate(S.submitted) + (S.auto ? ' (time ran out)' : ''));
    L.push('Score: ' + score + ' / ' + N + ' (' + pct + '%) · ' + badge(pct)[0]);
    L.push('Time used: ' + fmtTime(S.submitted - S.started) + ' of 50 min');
    if (S.attempt > 1) L.push('Attempt: ' + S.attempt + ' on this device');
    L.push('');
    L.push('By section:');
    perSec.forEach(function (r) { L.push('· ' + r.s.name + ': ' + r.c + '/' + r.t); });
    var missed = [];
    for (var i = 0; i < N; i++) if (!correct(i)) missed.push(i);
    L.push('');
    if (!missed.length) { L.push('Missed: none!'); }
    else {
      L.push('Missed (' + missed.length + '):');
      missed.forEach(function (i) {
        var y = answerText(i, S.answers[i]);
        L.push('Q' + (i + 1) + ' · ' + secOf(Qs[i]).name + ' · answered: ' + (y === null ? '(no answer)' : y.replace(/\n/g, ' / ')) + ' · correct: ' + correctText(i).replace(/\n/g, ' / '));
      });
    }
    return L.join('\n');
  }

  function copyText(txt, btn) {
    function done() { btn.textContent = 'Copied! Now paste it in Google Classroom'; toast('Results copied'); }
    function fallback() {
      var ta = document.getElementById('copytxt');
      var det = document.getElementById('copydet'); if (det) det.open = true;
      ta.focus(); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) done(); else { btn.textContent = 'Press Ctrl + C to copy the selected text'; }
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback);
    else fallback();
  }

  var filterMissed = false;
  function renderResults() {
    chrome(false);
    var score = 0, perSec = SECS.map(function (s) { return { s: s, c: 0, t: 0 }; });
    for (var i = 0; i < N; i++) {
      var ok = correct(i); if (ok) score++;
      perSec.forEach(function (r) { if (r.s.id === Qs[i].sec) { r.t++; if (ok) r.c++; } });
    }
    var pct = Math.round(100 * score / N), b = badge(pct), txt = resultsText(score, pct, perSec);
    var deg = Math.round(360 * score / N);
    var h = '';
    if (S.auto) h += '<div class="banner">Time’s up! Your answers were sent in automatically.</div>';
    h += '<section class="hero"><div class="ring" style="background:conic-gradient(#7ED957 ' + deg + 'deg, rgba(255,255,255,.12) 0)"><div class="in"><div><div class="sc">' + score + '</div><div class="of">of ' + N + '</div></div></div></div>' +
      '<div><div class="badge">' + esc(b[0]) + ' · ' + pct + '%</div><h2>Checkpoint complete, ' + esc(S.name) + '!</h2><p>' + esc(b[1]) + ' Time used: ' + fmtTime(S.submitted - S.started) + '.</p></div></section>';
    h += '<section class="card copybox" style="margin-top:14px"><p><b>Send your results to your teacher.</b> Copy them, then paste them into Google Classroom as a private comment on the quiz post.</p>' +
      '<button class="btn green big" type="button" id="copy">Copy my results</button>' +
      '<details id="copydet"><summary>See what gets copied</summary><textarea class="copytxt" id="copytxt" readonly>' + esc(txt) + '</textarea></details></section>';
    h += '<section class="card" style="margin-top:14px"><div class="bars">' + perSec.map(function (r) {
      return '<div class="bar-row"><span class="nm">' + esc(r.s.name) + '<small>' + esc(r.s.classes) + '</small></span><span class="v">' + r.c + '/' + r.t + '</span><div class="track"><div class="fill" style="width:' + (100 * r.c / r.t) + '%"></div></div></div>';
    }).join('') + '</div></section>';
    h += '<div class="rev-head"><h2>Review your answers</h2><div class="toggle"><button type="button" id="fAll" class="' + (filterMissed ? '' : 'on') + '">All</button><button type="button" id="fMiss" class="' + (filterMissed ? 'on' : '') + '">Only missed (' + (N - score) + ')</button></div></div>';
    for (var j = 0; j < N; j++) {
      var q = Qs[j], ok2 = correct(j);
      if (filterMissed && ok2) continue;
      var a = S.answers[j], yours = answerText(j, a);
      var why = '';
      if (!ok2 && q.kind === 'mcq' && a !== undefined && a !== null && q.options[a].note) why = '<p class="note">What your choice does: ' + esc(q.options[a].note) + '</p>';
      h += '<section class="card rev' + (ok2 ? '' : ' wrong') + '"><div class="rtop"><span class="mark">' + (ok2 ? 'CORRECT' : (yours === null ? 'NO ANSWER' : 'NOT QUITE')) + '</span><span class="rq">Q' + (j + 1) + ' · ' + esc(secOf(q).name) + '</span></div>' +
        '<h3 class="prompt">' + q.prompt + '</h3>' + extras(q) +
        '<dl class="ans"><dt>Your answer</dt><dd class="mono yours ' + (ok2 ? 'good' : 'bad') + '">' + (yours === null ? '(no answer)' : esc(yours)) + '</dd>' +
        (ok2 ? '' : '<dt>Correct</dt><dd class="mono right">' + esc(correctText(j)) + '</dd>') + '</dl>' + why +
        '<div class="why"><b>Why:</b> ' + esc(q.explain) + '</div></section>';
    }
    app.innerHTML = h;
    var btn = document.getElementById('copy');
    btn.onclick = function () { copyText(txt, btn); };
    document.getElementById('fAll').onclick = function () { filterMissed = false; renderResults(); };
    document.getElementById('fMiss').onclick = function () { filterMissed = true; renderResults(); };
  }

  if (S.started && !S.submitted) startTimer();
  render();
})();
</script>
</body>
</html>
